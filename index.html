<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desk Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<style>
  :root { --h: 100vh; --orange: #ff9f0a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: var(--h);
    background: #000; color: #fff; overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-text-size-adjust: 100%;
  }
  .stage {
    width: 100%; height: var(--h);
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    padding: 0 3vw;
  }
  /* clock: square, sized by height */
  .clock { height: calc(var(--h) * 0.92); width: calc(var(--h) * 0.92); -webkit-flex: none; flex: none; }
  .clock svg { width: 100%; height: 100%; display: block; }

  .weather {
    margin-left: 5vw;
    -webkit-flex: 1; flex: 1; min-width: 0;
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-justify-content: center; justify-content: center;
  }
  .temp {
    font-size: calc(var(--h) * 0.46);
    font-weight: 500; line-height: 0.95; letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .icon { font-size: calc(var(--h) * 0.085); line-height: 1; margin-top: calc(var(--h) * 0.03); }
  .cond { font-size: calc(var(--h) * 0.075); font-weight: 500; margin-top: calc(var(--h) * 0.012); white-space: nowrap; }
  .hl   { font-size: calc(var(--h) * 0.075); font-weight: 500; margin-top: calc(var(--h) * 0.005); white-space: nowrap; }
  .status { font-size: calc(var(--h) * 0.05); color: #8e8e93; margin-top: calc(var(--h) * 0.02); }
</style>
</head>
<body>
<div class="stage">
  <div class="clock"><svg id="face" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="weather">
    <div class="temp" id="temp">--°</div>
    <div class="icon" id="icon"></div>
    <div class="cond" id="cond">Loading…</div>
    <div class="hl" id="hl"></div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
/* ---------- Settings ---------- */
var UNIT = "celsius";            // "celsius" or "fahrenheit"
var REFRESH_MS = 10 * 60 * 1000; // weather refresh: every 10 minutes

/* ---------- Fit exactly to the visible viewport ---------- */
function fit() {
  document.documentElement.style.setProperty("--h", window.innerHeight + "px");
}
fit();
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", function () { setTimeout(fit, 200); });

/* ---------- Analog clock ---------- */
var NS = "http://www.w3.org/2000/svg";
var face = document.getElementById("face");
function el(name, attrs, parent) {
  var e = document.createElementNS(NS, name);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  (parent || face).appendChild(e);
  return e;
}

// ticks
for (var i = 0; i < 60; i++) {
  var major = i % 5 === 0;
  el("line", {
    x1: 100, y1: major ? 5 : 5, x2: 100, y2: major ? 12 : 11,
    stroke: major ? "#fff" : "#8e8e93",
    "stroke-width": major ? 2.2 : 1.6,
    "stroke-linecap": "butt",
    transform: "rotate(" + (i * 6) + " 100 100)"
  });
}
// numbers
for (var n = 1; n <= 12; n++) {
  var a = n * 30 * Math.PI / 180;
  var t = el("text", {
    x: 100 + Math.sin(a) * 76, y: 100 - Math.cos(a) * 76 + 0.5,
    fill: "#fff", "font-size": 21, "font-weight": 500,
    "text-anchor": "middle", "dominant-baseline": "central",
    "font-family": "-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
  });
  t.textContent = n;
}
var hourHand = el("line", { x1: 100, y1: 108, x2: 100, y2: 56, stroke: "#fff", "stroke-width": 6.5, "stroke-linecap": "round" });
var minHand  = el("line", { x1: 100, y1: 108, x2: 100, y2: 22, stroke: "#fff", "stroke-width": 6.5, "stroke-linecap": "round" });
var secHand  = el("line", { x1: 100, y1: 122, x2: 100, y2: 12, stroke: "#ff9f0a", "stroke-width": 1.4, "stroke-linecap": "round" });
el("circle", { cx: 100, cy: 100, r: 4.6, fill: "#000", stroke: "#ff9f0a", "stroke-width": 2.2 });

function tick() {
  var d = new Date();
  var ms = d.getMilliseconds();
  var s = d.getSeconds() + ms / 1000;
  var m = d.getMinutes() + s / 60;
  var h = (d.getHours() % 12) + m / 60;
  hourHand.setAttribute("transform", "rotate(" + (h * 30) + " 100 100)");
  minHand.setAttribute("transform", "rotate(" + (m * 6) + " 100 100)");
  secHand.setAttribute("transform", "rotate(" + (s * 6) + " 100 100)");
  (window.requestAnimationFrame || function (f) { setTimeout(f, 33); })(tick);
}
tick();

/* ---------- Weather (Open-Meteo, no API key) ---------- */
var WMO = {
  0:  ["Clear", "☀️", "🌙"],
  1:  ["Mostly Clear", "🌤️", "🌙"],
  2:  ["Partly Cloudy", "⛅", "☁️"],
  3:  ["Cloudy", "☁️", "☁️"],
  45: ["Fog", "🌫️", "🌫️"], 48: ["Fog", "🌫️", "🌫️"],
  51: ["Drizzle", "🌦️", "🌧️"], 53: ["Drizzle", "🌦️", "🌧️"], 55: ["Drizzle", "🌧️", "🌧️"],
  56: ["Freezing Drizzle", "🌧️", "🌧️"], 57: ["Freezing Drizzle", "🌧️", "🌧️"],
  61: ["Light Rain", "🌦️", "🌧️"], 63: ["Rain", "🌧️", "🌧️"], 65: ["Heavy Rain", "🌧️", "🌧️"],
  66: ["Freezing Rain", "🌧️", "🌧️"], 67: ["Freezing Rain", "🌧️", "🌧️"],
  71: ["Light Snow", "🌨️", "🌨️"], 73: ["Snow", "🌨️", "🌨️"], 75: ["Heavy Snow", "❄️", "❄️"],
  77: ["Snow Grains", "🌨️", "🌨️"],
  80: ["Showers", "🌦️", "🌧️"], 81: ["Showers", "🌧️", "🌧️"], 82: ["Heavy Showers", "🌧️", "🌧️"],
  85: ["Snow Showers", "🌨️", "🌨️"], 86: ["Snow Showers", "🌨️", "🌨️"],
  95: ["Thunderstorms", "⛈️", "⛈️"], 96: ["Thunderstorms", "⛈️", "⛈️"], 99: ["Thunderstorms", "⛈️", "⛈️"]
};

var elTemp = document.getElementById("temp"),
    elIcon = document.getElementById("icon"),
    elCond = document.getElementById("cond"),
    elHL   = document.getElementById("hl"),
    elStat = document.getElementById("status");

function getPosition(cb) {
  function fallbackIP() {
    // Approximate location by IP if GPS/geolocation is unavailable (e.g. page not on HTTPS)
    fetch("https://ipwho.is/")
      .then(function (r) { return r.json(); })
      .then(function (j) { j && j.latitude ? cb(j.latitude, j.longitude) : cb(null); })
      .catch(function () { cb(null); });
  }
  if (!navigator.geolocation) return fallbackIP();
  navigator.geolocation.getCurrentPosition(
    function (p) { cb(p.coords.latitude, p.coords.longitude); },
    fallbackIP,
    { timeout: 15000, maximumAge: 10 * 60 * 1000 }
  );
}

function loadWeather() {
  getPosition(function (lat, lon) {
    if (lat == null) { elStat.textContent = "Location unavailable"; return; }
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&current=temperature_2m,weather_code,is_day" +
      "&daily=temperature_2m_max,temperature_2m_min" +
      "&temperature_unit=" + UNIT + "&timezone=auto&forecast_days=1";
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var c = j.current, d = j.daily;
        var w = WMO[c.weather_code] || ["—", "", ""];
        elTemp.textContent = Math.round(c.temperature_2m) + "°";
        elIcon.textContent = c.is_day ? w[1] : w[2];
        elCond.textContent = w[0];
        elHL.textContent = "H:" + Math.round(d.temperature_2m_max[0]) + "°  L:" + Math.round(d.temperature_2m_min[0]) + "°";
        elStat.textContent = "";
      })
      .catch(function () { elStat.textContent = "Weather offline"; });
  });
}

loadWeather();
setInterval(loadWeather, REFRESH_MS);
</script>
</body>
</html>
